version: '3.8'

services:
  pngtosvg-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pngtosvg-api
    ports:
      - "8010:8000"
    env_file:
      - .env
    
    volumes:
      # Mount the temp directory for file persistence
      - ./temp:/app/temp
      # Optional: Mount source code for development
      # - ./pngtosvg:/app
    
    restart: unless-stopped
    
    # Optional: Healthcheck (uncomment if needed)
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:8000/"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 5s
    
    networks:
      - pngtosvg-network
    
    # Optional: Resource limits
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1'
    #       memory: 1G

  # Optional: Nginx reverse proxy (uncomment if needed)
  # nginx:
  #   image: nginx:alpine
  #   container_name: pngtosvg-nginx
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - pngtosvg-api
  #   networks:
  #     - pngtosvg-network
  #   restart: unless-stopped

networks:
  pngtosvg-network:
    driver: bridge

volumes:
  temp:
    driver: local
